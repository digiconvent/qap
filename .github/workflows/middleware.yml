name: middleware

on:
  push:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'middleware/**', 'docs/**', 'client/src/version.ts', '.github/workflows/middleware.yml']
  pull_request:
    paths: ['go.mod', 'go.sum', 'middleware/**', 'docs/**', 'client/src/version.ts', '.github/workflows/middleware.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      - run: go test -race ./...
